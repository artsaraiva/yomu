name: CodeQL

# Not on PRs: CodeQL traces a from-scratch build of all of llama.cpp, which
# took ~20 minutes per PR. Findings land on main after merge and weekly.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin, c-cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin, c-cpp
          build-mode: manual
      # CodeQL extracts by tracing the compiler, so the build must run in this
      # process from scratch: no daemon, no build cache. One ABI: the x86_64 build is
      # the same C++ source and doubles the tracing time.
      - name: Build
        run: ./gradlew --no-daemon --no-build-cache assembleDebug -Pyomu.abis=arm64-v8a
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
