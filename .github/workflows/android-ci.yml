name: Android CI

# PRs get the fast lane: lint, debug unit tests, and one native ABI.
# main gets the full build: every ABI and release unit tests too. The push
# run is also what writes the Gradle cache that PR runs read from.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-ci:
    name: Android CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check code standards
        run: ./gradlew detekt && scripts/check-code-standards.sh
      - name: Verify Android project (PR)
        if: github.event_name == 'pull_request'
        run: ./gradlew lint :core:test testDebugUnitTest assembleDebug -Pyomu.abis=arm64-v8a
      - name: Verify Android project (main)
        if: github.event_name == 'push'
        run: ./gradlew lint test assembleDebug
