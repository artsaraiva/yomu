name: Android CI

# PRs get the fast lane: lint, debug unit tests, and one native ABI.
# main gets the full build: every ABI and release unit tests too. The push
# run is also what writes the Gradle cache that PR runs read from.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-ci:
    name: Android CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify Android project (PR)
        if: github.event_name == 'pull_request'
        run: ./gradlew lint :core:test testDebugUnitTest assembleDebug -Pyomu.abis=arm64-v8a
      - name: Verify Android project (main)
        if: github.event_name == 'push'
        run: ./gradlew lint test assembleDebug
