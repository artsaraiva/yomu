name: Release

# Pushing a v* tag publishes a signed APK as a GitHub Release (#405).
# arm64 only: every supported phone is arm64, and it halves the download.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Build signed APK
        env:
          YOMU_KEYSTORE_BASE64: ${{ secrets.YOMU_KEYSTORE_BASE64 }}
          YOMU_KEYSTORE_PASSWORD: ${{ secrets.YOMU_KEYSTORE_PASSWORD }}
          YOMU_KEY_ALIAS: ${{ secrets.YOMU_KEY_ALIAS }}
          YOMU_KEY_PASSWORD: ${{ secrets.YOMU_KEY_PASSWORD }}
        run: |
          export YOMU_KEYSTORE_FILE="$RUNNER_TEMP/yomu.jks"
          echo "$YOMU_KEYSTORE_BASE64" | base64 -d > "$YOMU_KEYSTORE_FILE"
          ./gradlew :app:assembleRelease -Pyomu.abis=arm64-v8a -Pyomu.versionName="${GITHUB_REF_NAME#v}" -Pyomu.versionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "yomu-$GITHUB_REF_NAME.apk"
      - name: Verify signature
        run: "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs yomu-$GITHUB_REF_NAME.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "yomu-$GITHUB_REF_NAME.apk" --generate-notes
