name: CLA

# Outside contributors agree to CLA.md once, with a comment on their pull
# request (ADR-0021). The check fails until every commit author in the PR has
# agreed or is on the allowlist. Agreements are kept on the cla-signatures
# branch, which the main ruleset doesn't cover, so the action can push to it.
#
# pull_request_target runs this file from main with a write token. It must
# never check out or run code from the PR: the action reads commit authors and
# comments through the API only, and there are no other steps.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  cla:
    name: CLA
    # PR events, except a PR closed without merging, and comments on a PR that
    # agree to the CLA or ask for a recheck. A merged PR gets locked so its
    # agreement comments can't be edited or deleted later.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' &&
        (github.event.action != 'closed' || github.event.pull_request.merged)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # re-run the failed check once everyone has agreed
      contents: write # record agreements on the cla-signatures branch
      pull-requests: write # comment on the PR, lock it after merge
    steps:
      # Archived upstream since March 2026; pinned to the v2.6.1 commit so the
      # code can't change. If it stops running, see ADR-0021's fallback.
      - name: Check CLA agreements
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/artsaraiva/yomu/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: artsaraiva,dependabot[bot],coderabbitai[bot]
          signed-commit-message: 'chore: record CLA agreement by $contributorName'
