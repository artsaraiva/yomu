name: Feature request
description: Suggest something Yomu should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The reading situation where Yomu falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Keep in mind that every model runs on the phone and nothing is sent to a server.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you considered?
