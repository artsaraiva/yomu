version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    assignees:
      - artsaraiva
    # AGP, Kotlin and KSP only work in lockstep, and a major bump of any of
    # them is a migration (AGP 9 drops the kotlin.android plugin), not a PR
    # to merge. Gradle 9, Retrofit 3 and newer Compose BOMs need Kotlin 2 or
    # compileSdk 37.
    # The Kotlin 1.9 compiler reads kotlin-stdlib metadata only up to 2.0, so
    # even a minor bump built on stdlib 2.1+ breaks the build (#491): Hilt
    # 2.56+, coroutines 1.10+, androidx.core 1.18+, Room 2.7+, androidx.hilt
    # 1.4+, navigation 2.10+ and Retrofit 2.12+. Drop these ignores when
    # migrating to Kotlin 2.
    ignore:
      - dependency-name: "com.android.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.devtools.ksp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.dagger*"
        versions: [">= 2.56"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines*"
        versions: [">= 1.10"]
      - dependency-name: "androidx.core:core*"
        versions: [">= 1.18"]
      - dependency-name: "androidx.room:*"
        versions: [">= 2.7"]
      - dependency-name: "androidx.hilt:*"
        versions: [">= 1.4"]
      - dependency-name: "androidx.navigation:*"
        versions: [">= 2.10"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.retrofit2*"
        versions: [">= 2.12"]
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-major"]
    groups:
      # First match wins, so the toolchain lands as one PR instead of
      # kotlin.jvm moving without kotlin.android. Names are exact: the
      # "com.android.*" wildcards let AGP and Kotlin fall through to
      # gradle-minor-patch (#263) while KSP moved alone (#262). The wrapper
      # is here because each AGP minor raises the minimum Gradle version.
      toolchain:
        patterns:
          - "com.android.application"
          - "com.android.library"
          - "org.jetbrains.kotlin.android"
          - "org.jetbrains.kotlin.jvm"
          - "com.google.devtools.ksp"
          - "gradle-wrapper"
      gradle-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - artsaraiva
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # llama.cpp moves daily and its C API churns; a monthly bump keeps the
  # native engine patched without a PR every week.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    assignees:
      - artsaraiva
